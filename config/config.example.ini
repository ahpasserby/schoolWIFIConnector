# schoolwifi 配置示例
#
# 复制到 ~/.config/schoolwifi/config.ini 后按需修改，
# 或者直接运行 `schoolwifi setup` 交互式生成。
#
# 绝大多数学校只需要填 [account] 的 username 就够了 —— [portal] 整段都可以留空，
# 程序会自动探测登录页并识别表单。只有在 `schoolwifi login` 失败时，
# 才需要根据 `schoolwifi diagnose` 的输出来填 [portal]。

[network]
# 只在连接到这个 SSID 时才自动登录。留空表示任何网络都尝试。
# 建议填上，避免在家里的 WiFi 上把校园网密码发给别的路由器。
ssid = CAMPUS-WIFI

# 无线网卡。绝大多数 Mac 是 en0。
interface = en0

# 系统 DNS 解析不了门户域名时，改用哪台 DNS 来解析。
# 留空 = 自动使用本网络 DHCP 下发的 DNS（通常就是校园 DNS）。
# 只有在你手工写死了公共 DNS（如 223.5.5.5）、而门户域名又是内网域名时才有用。
dns_server =


[account]
# 学号 / 校园网账号
username = 20210001

# 密码存在 macOS 钥匙串里，不写在这个文件中（由 `schoolwifi setup` 写入）。
keychain_service = schoolwifi

# 也可以直接写明文密码，但不推荐 —— 只在钥匙串不可用时使用：
# password = your-password


[portal]
# form = 自动发现登录页、解析表单并提交（默认，适用于绝大多数学校）
# raw  = 直接把 post_body 提交到 login_url，用于纯 API 式的认证接口
login_method = form

# 留空则自动探测。如果自动探测失败，把 `schoolwifi diagnose` 里
# "login page:" 那一行的地址填到这里。
login_url =

# 注销地址，用于 `schoolwifi logout`。支持 {username} 占位符。
logout_url =

# 表单字段名。留空则自动识别；识别错了就按 diagnose 的输出手动指定。
username_field =
password_field =

# 额外要提交的字段，比如运营商、域。可以写多行。
# field.domain = cmcc
# field.operator = telecom

# 判断登录成功 / 失败的标志串（在响应正文里查找）。
# 留空则用「重新探测网络是否真的通了」来判断，通常更可靠。
success_contains =
failure_contains =

# 连通性探测地址，逗号分隔。默认会依次尝试 Apple / 华为 / 微软的检测地址。
probe_urls =

# 伪装的 User-Agent。留空使用内置的 Safari UA —— 有些门户会对
# 未知 UA 返回不同（甚至坏掉）的页面。
user_agent =


# --- login_method = raw 时才需要 ---------------------------------------
# 支持的占位符：{username} {password}，以及 URL 编码形式 {username|url} {password|url}
#
# http_method = POST
# login_url = http://10.0.0.1:801/eportal/
# post_body = user_account={username|url}&user_password={password|url}


[watch]
# 已在线时的探测间隔（秒）
online_interval = 30

# 检测到门户拦截时的重试间隔（秒）
captive_interval = 5

# 连续失败多少次后退避
max_retries = 3

# 退避时长（秒）
retry_backoff = 30

# 后台守护进程的日志文件
log_file = ~/Library/Logs/schoolwifi.log
